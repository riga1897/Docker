# Production Docker Compose Configuration
# Используется для deployment на production сервере через GitHub Actions CI/CD
#
# Требования:
# - Docker Compose v2+
# - .env файл с production переменными (см. .env.production.example)
# - GitHub Container Registry образ для web/celery сервисов
#
# Запуск:
#   export GITHUB_REPOSITORY=username/repo
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  # PostgreSQL Database
  db:
    image: postgres:16
    container_name: lms_postgres
    volumes:
      # Production использует host path для persistence
      - /opt/lms/postgres-data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-lms_db}
      - POSTGRES_USER=${POSTGRES_USER:-lms_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    # Порты НЕ публикуются наружу для безопасности (только внутри сети)
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms_user} -d ${POSTGRES_DB:-lms_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lms_network
    restart: unless-stopped

  # Redis (Message Broker для Celery)
  redis:
    image: redis:7-alpine
    container_name: lms_redis
    # Порты НЕ публикуются наружу для безопасности
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - lms_network
    restart: unless-stopped

  # Django Web Application (Gunicorn)
  web:
    # Образ из GitHub Container Registry (pull перед deployment)
    # Используется переменная IMAGE_TAG из environment (по умолчанию latest)
    image: ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: lms_web
    # Production использует Gunicorn вместо runserver
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application
             --bind 0.0.0.0:8000
             --workers 4
             --timeout 120
             --access-logfile -
             --error-logfile -"
    volumes:
      # Host volumes для media и static files (Nginx будет отдавать их напрямую)
      - /opt/lms/media:/app/media
      - /opt/lms/staticfiles:/app/staticfiles
      - /opt/lms/logs:/app/logs
    ports:
      # Только порт 8000 публикуется (Nginx reverse proxy)
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lms_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lms_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=False
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - lms_network
    restart: unless-stopped

  # Celery Worker (обработка асинхронных задач)
  celery_worker:
    image: ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: lms_celery_worker
    command: celery -A config worker --loglevel=info --concurrency=2
    volumes:
      - /opt/lms/media:/app/media
      - /opt/lms/logs:/app/logs
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lms_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lms_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout=10 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - lms_network
    restart: unless-stopped

  # Celery Beat (планировщик периодических задач)
  celery_beat:
    image: ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: lms_celery_beat
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - /opt/lms/logs:/app/logs
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lms_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lms_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - lms_network
    restart: unless-stopped

# Сеть для взаимодействия сервисов
networks:
  lms_network:
    name: lms_network
    driver: bridge
