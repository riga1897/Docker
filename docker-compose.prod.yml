# Production Docker Compose Configuration
# Используется для deployment на production сервере через GitHub Actions CI/CD
#
# Требования:
# - Docker Compose v2+
# - .env файл с production переменными (см. .env.production.example)
# - GitHub Container Registry образ для web/celery сервисов
#
# Запуск:
#   export GITHUB_REPOSITORY=username/repo
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  # PostgreSQL Database
  db:
    image: postgres:16
    container_name: lms_postgres
    volumes:
      # Production использует host path для persistence
      - /opt/lms/postgres-data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-lms_db}
      - POSTGRES_USER=${POSTGRES_USER:-lms_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    # Порты НЕ публикуются наружу для безопасности (только внутри сети)
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms_user} -d ${POSTGRES_DB:-lms_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lms_network
    restart: unless-stopped

  # Redis (Message Broker для Celery)
  redis:
    image: redis:7-alpine
    container_name: lms_redis
    # Порты НЕ публикуются наружу для безопасности
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - lms_network
    restart: unless-stopped

  # Django Web Application (Gunicorn)
  web:
    # Образ из GitHub Container Registry (pull перед deployment)
    # Используется переменная IMAGE_TAG из environment (по умолчанию latest)
    image: ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: lms_web
    # Production использует Gunicorn (команда по умолчанию из Dockerfile CMD)
    # collectstatic выполняется в docker-entrypoint.sh автоматически
    volumes:
      # Named volumes для media и static files (shared с Nginx)
      - staticfiles_data:/app/staticfiles
      - media_data:/app/media
      - logs_data:/app/logs
    # Порт 8000 НЕ публикуется наружу (только внутри Docker сети)
    # Nginx будет проксировать запросы на web:8000
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lms_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lms_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=False
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - lms_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: lms_nginx
    volumes:
      # Nginx конфигурация
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Shared volumes для отдачи статических файлов
      - staticfiles_data:/usr/share/nginx/html/static:ro
      - media_data:/usr/share/nginx/html/media:ro
    ports:
      # Публичные порты HTTP и HTTPS
      - "80:80"
      - "443:443"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - lms_network
    restart: unless-stopped

  # Celery Worker (обработка асинхронных задач)
  celery_worker:
    image: ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: lms_celery_worker
    command: celery -A config worker --loglevel=info --concurrency=2
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lms_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lms_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout=10 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - lms_network
    restart: unless-stopped

  # Celery Beat (планировщик периодических задач)
  celery_beat:
    image: ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: lms_celery_beat
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - logs_data:/app/logs
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lms_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lms_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - lms_network
    restart: unless-stopped

# Сеть для взаимодействия сервисов
networks:
  lms_network:
    name: lms_network
    driver: bridge

# Named volumes для persistence данных
volumes:
  # Статические файлы Django (собираются через collectstatic)
  # Shared между web и nginx контейнерами
  staticfiles_data:
  
  # Медиа файлы пользователей (uploads)
  # Shared между web, celery и nginx контейнерами
  media_data:
  
  # Логи приложения
  logs_data:
