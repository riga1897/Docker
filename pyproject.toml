[build-system]
requires = ["poetry-core>=2.2.1,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
name = "DRF"
version = "0.1.0"
description = "Django REST Framework Learning Management System"
authors = ["Ri Ga <riga1897@yandex.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
# Python версия: ^3.12 для совместимости локальной разработки (Replit 3.12.11)
# Production/CI закреплены на 3.13.5 через Dockerfile и GitHub Actions
python = "^3.12"
django = "^5.2.7"
djangorestframework = "^3.16.1"
djangorestframework-simplejwt = "^5.5.1"
djangorestframework-stubs = "^3.16.5"
drf-spectacular = "^0.29.0"
django-filter = "^25.2"
django-cors-headers = "^4.9.0"
django-celery-beat = "^2.8.1"
django-stubs = "^5.2.5"
celery = "^5.6.0rc2"
redis = "^7.0.0"
psycopg2-binary = "^2.9.10"
dj-database-url = "^3.0.1"
python-dotenv = "^1.2.1"
pillow = "^12.0.0"
requests = "^2.32.4"
gunicorn = "^23.0.0"
stripe = "^14.0.1"
django-stub = "==0.1"
kombu = "==5.6.0"
poetry-core = "==2.2.1"
pydocstyle = "==6.3.0"
snowballstemmer = "==3.0.1"
pytest = "==9.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
pytest-django = "^4.11.1"
pytest-mock = "^3.15.0"
pytest-cov = "^7.0.0"
pytest-xdist = "^3.8.0"
pytest-env = "^1.1.5"
factory-boy = "^3.3.1"
ipython = "^9.6.0"
black = "^25.1.0"
isort = "^7.0.0"
ruff = "^0.14.2"
mypy = "^1.17.1"
flake8 = "^7.3.0"
types-django-filter = "^25.2.0.20251010"
pre-commit = "^4.3.0"

[tool.poetry.scripts]
check = "scripts.check:main"
fix = "scripts.fix:main"

[tool.black]
line-length = 119
exclude = '''
(
    /(
        \.eggs
      | \.git
      | \.hg
      | \.mypy_cache
      | \.tox
      | \.venv
      | migrations
      | attached_assets
      | vehicle
    )/
)
'''

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

exclude = [
    "^tests/",
    "^migrations/",
    "^attached_assets/",
    "^vehicle/",
    "\\.venv",
    "\\.idea"
]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "rest_framework.*"
ignore_missing_imports = true

[tool.isort]
line_length = 119
profile = "black"

[tool.ruff]
line-length = 119
preview = true

exclude = [
    ".venv",
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "*.egg-info",
    "migrations",
    "attached_assets",
    "vehicle",
    ".local",
    ".idea",
    "build",
    "dist",
]

force-exclude = true

[tool.ruff.lint]
select = [
    "B",    # flake8-bugbear
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "C90",  # mccabe
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"config/settings_test.py" = ["F403"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
cache_dir = "/tmp/.pytest_cache"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--reuse-db",
    "--cov=users",
    "--cov=lms",
    "--cov=config",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--tb=short",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.pytest_env]
PYTEST_RUNNING = "1"

[tool.coverage.run]
data_file = "/tmp/.coverage"
source = ["users", "lms", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
    "*/tests_backup/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "manage.py",
    "*/wsgi.py",
    "*/asgi.py",
    "*/settings_test.py",
    "*/settings.py",
    "*/__init__.py",
    "*/scripts/*",
    "*/management/commands/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "/tmp/htmlcov"
