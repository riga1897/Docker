name: Django LMS CI/CD Pipeline

on:
  push:
    # Запускается при push в ЛЮБУЮ ветку
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================================
  # Job 1: Testing (Django + Pytest)
  # ============================================================================
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'test-secret-key-for-ci' }}
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.13.5
        uses: actions/setup-python@v4
        with:
          python-version: '3.13.5'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Cache Poetry packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-packages-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-packages-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev postgresql-client redis-tools

      - name: Install Python dependencies
        run: poetry install --no-root

      - name: Wait for databases
        run: |
          until pg_isready -h localhost -p 5432; do sleep 2; done
          until redis-cli -h localhost ping | grep -q PONG; do sleep 2; done

      - name: Run migrations
        run: poetry run python manage.py migrate --noinput

      - name: Run Django APITestCase tests (78 tests)
        run: |
          poetry run coverage run --source='users,lms,config' manage.py test

      - name: Run Pytest tests (187 tests) with parallel execution
        run: |
          poetry run pytest --cov=users --cov=lms --cov=config --cov-append -v -n auto

      - name: Generate coverage report
        run: |
          poetry run coverage report --fail-under=85
          poetry run coverage html

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

  # ============================================================================
  # Job 2: Code Quality (Linting)
  # ============================================================================
  lint:
    runs-on: ubuntu-latest
    needs: test
    
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-linting
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.13.5
        uses: actions/setup-python@v4
        with:
          python-version: '3.13.5'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry virtualenv
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-lint-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-lint-

      - name: Cache Poetry packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-packages-lint-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-packages-lint-

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run comprehensive linting (parallel)
        run: |
          echo "🚀 Running all linters in parallel for faster feedback..."
          
          # Запускаем все линтеры параллельно через background jobs
          poetry run ruff check . &
          RUFF_PID=$!
          
          poetry run black --check . &
          BLACK_PID=$!
          
          poetry run isort --check-only . &
          ISORT_PID=$!
          
          poetry run mypy . &
          MYPY_PID=$!
          
          poetry run flake8 . &
          FLAKE8_PID=$!
          
          # Ожидаем завершения всех процессов
          wait $RUFF_PID
          RUFF_EXIT=$?
          
          wait $BLACK_PID
          BLACK_EXIT=$?
          
          wait $ISORT_PID
          ISORT_EXIT=$?
          
          wait $MYPY_PID
          MYPY_EXIT=$?
          
          wait $FLAKE8_PID
          FLAKE8_EXIT=$?
          
          # Проверяем результаты
          echo ""
          echo "=== Linting Results ==="
          
          FAILED=0
          
          if [ $RUFF_EXIT -ne 0 ]; then
            echo "❌ Ruff check failed"
            FAILED=1
          else
            echo "✅ Ruff check passed"
          fi
          
          if [ $BLACK_EXIT -ne 0 ]; then
            echo "❌ Black check failed"
            FAILED=1
          else
            echo "✅ Black check passed"
          fi
          
          if [ $ISORT_EXIT -ne 0 ]; then
            echo "❌ Isort check failed"
            FAILED=1
          else
            echo "✅ Isort check passed"
          fi
          
          if [ $MYPY_EXIT -ne 0 ]; then
            echo "❌ Mypy check failed"
            FAILED=1
          else
            echo "✅ Mypy check passed"
          fi
          
          if [ $FLAKE8_EXIT -ne 0 ]; then
            echo "❌ Flake8 check failed"
            FAILED=1
          else
            echo "✅ Flake8 check passed"
          fi
          
          # Выход с ошибкой если хотя бы один линтер упал
          exit $FAILED

  # ============================================================================
  # Job 3: Docker Build & Push to GHCR
  # ============================================================================
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, lint]
    # Запускается для main (production) И release/* (pre-production)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Prepare repository name (lowercase)
        run: |
          echo "REPO_LOWERCASE=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LOWERCASE }}
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=preprod-latest,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image info
        run: |
          echo "✅ Image built and pushed: ${{ env.REGISTRY }}/${{ env.REPO_LOWERCASE }}"
          echo "📦 Tags: ${{ steps.meta.outputs.tags }}"

  # ============================================================================
  # Job 4: Deploy to Pre-Production Server (release/* branches)
  # ============================================================================
  deploy-preprod:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    
    # Permissions для автоматического создания PR
    permissions:
      contents: write
      pull-requests: write
    
    env:
      # Используем preprod-latest тег для препрода
      IMAGE_TAG: preprod-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Prepare repository name (lowercase)
        run: |
          echo "REPO_LOWERCASE=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PREPROD_SSH_KEY }}

      - name: Install system dependencies on pre-production VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.PREPROD_SSH_USER }}@${{ secrets.PREPROD_SERVER_IP }} << 'EOFDEPS'
            set -e
            
            echo '🔍 Checking system dependencies...'
            
            # 1. Проверка и установка Docker
            if ! command -v docker &> /dev/null; then
              echo '📦 Docker not found. Installing Docker...'
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              
              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
                $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
                sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              
              # Добавляем текущего пользователя в группу docker
              sudo usermod -aG docker $USER
              echo '✅ Docker installed successfully!'
            else
              echo '✅ Docker is already installed'
              docker --version
            fi
            
            # 2. Проверка Docker Compose v2
            if ! docker compose version &> /dev/null; then
              echo '⚠️ Docker Compose v2 plugin not found. Installing...'
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
              echo '✅ Docker Compose v2 installed successfully!'
            else
              echo '✅ Docker Compose v2 is available'
              docker compose version
            fi
            
            # 3. Создание директории деплоя
            if [ ! -d "${{ secrets.PREPROD_DEPLOY_DIR }}" ]; then
              echo '📁 Creating deployment directory: ${{ secrets.PREPROD_DEPLOY_DIR }}'
              sudo mkdir -p ${{ secrets.PREPROD_DEPLOY_DIR }}
              sudo chown -R $USER:$USER ${{ secrets.PREPROD_DEPLOY_DIR }}
              echo '✅ Deployment directory created!'
            else
              echo '✅ Deployment directory already exists'
              # Убеждаемся что права корректны
              sudo chown -R $USER:$USER ${{ secrets.PREPROD_DEPLOY_DIR }}
            fi
            
            echo '🎉 All system dependencies are ready!'
          EOFDEPS

      - name: Copy docker-compose.prod.yml to preprod server
        run: |
          scp -o StrictHostKeyChecking=no \
            docker-compose.prod.yml \
            ${{ secrets.PREPROD_SSH_USER }}@${{ secrets.PREPROD_SERVER_IP }}:${{ secrets.PREPROD_DEPLOY_DIR }}/

      - name: Copy nginx.conf to preprod server
        run: |
          scp -o StrictHostKeyChecking=no \
            nginx.conf \
            ${{ secrets.PREPROD_SSH_USER }}@${{ secrets.PREPROD_SERVER_IP }}:${{ secrets.PREPROD_DEPLOY_DIR }}/

      - name: Copy generate-preprod-env.sh script to server
        run: |
          scp -o StrictHostKeyChecking=no \
            scripts/generate-preprod-env.sh \
            ${{ secrets.PREPROD_SSH_USER }}@${{ secrets.PREPROD_SERVER_IP }}:${{ secrets.PREPROD_DEPLOY_DIR }}/

      - name: Generate pre-production .env file
        env:
          PREPROD_SERVER_IP: ${{ secrets.PREPROD_SERVER_IP }}
          PREPROD_STRIPE_SECRET_KEY: ${{ secrets.PREPROD_STRIPE_SECRET_KEY }}
          PREPROD_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PREPROD_STRIPE_PUBLISHABLE_KEY }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.PREPROD_SSH_USER }}@${{ secrets.PREPROD_SERVER_IP }} << 'EOFENV'
            set -e
            cd ${{ secrets.PREPROD_DEPLOY_DIR }}
            
            echo '🔐 Generating pre-production .env file...'
            
            # Make script executable
            chmod +x generate-preprod-env.sh
            
            # Run script with required environment variables
            PREPROD_SERVER_IP="${{ secrets.PREPROD_SERVER_IP }}" \
            PREPROD_STRIPE_SECRET_KEY="${{ secrets.PREPROD_STRIPE_SECRET_KEY }}" \
            PREPROD_STRIPE_PUBLISHABLE_KEY="${{ secrets.PREPROD_STRIPE_PUBLISHABLE_KEY }}" \
            ./generate-preprod-env.sh
            
            echo '✅ Pre-production .env ready!'
          EOFENV

      - name: Deploy to pre-production server
        env:
          GITHUB_REPOSITORY: ${{ env.REPO_LOWERCASE }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.PREPROD_SSH_USER }}@${{ secrets.PREPROD_SERVER_IP }} << 'EOFSH'
            set -e
            
            export DEPLOY_DIR="${{ secrets.PREPROD_DEPLOY_DIR }}"
            export GITHUB_REPOSITORY="${{ env.REPO_LOWERCASE }}"
            export REGISTRY="${{ env.REGISTRY }}"
            export IMAGE_TAG="${{ env.IMAGE_TAG }}"
            
            cd ${DEPLOY_DIR}
            
            echo '🚀 Starting pre-production deployment...'
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Deploy directory: ${DEPLOY_DIR}"
            echo "Image tag: ${IMAGE_TAG}"
            
            # 1. Проверка и создание host directories
            echo '🔍 Validating host directories...'
            for dir in media staticfiles logs postgres-data; do
              if [ ! -d "${DEPLOY_DIR}/${dir}" ]; then
                echo "Creating directory: ${DEPLOY_DIR}/${dir}"
                mkdir -p "${DEPLOY_DIR}/${dir}"
              fi
            done
            
            # 2. Проверка .env файла
            echo '🔍 Validating .env file...'
            if [ ! -f "${DEPLOY_DIR}/.env" ]; then
              echo '❌ ERROR: .env file not found at ${DEPLOY_DIR}/.env'
              echo 'This should have been auto-generated by generate-preprod-env.sh'
              exit 1
            fi
            echo '✅ .env file exists'
            
            # 3. Проверка docker-compose.prod.yml
            if [ ! -f "${DEPLOY_DIR}/docker-compose.prod.yml" ]; then
              echo '❌ ERROR: docker-compose.prod.yml not found'
              exit 1
            fi
            
            # 4. Логин в GHCR
            echo '🔐 Login to GitHub Container Registry...'
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${REGISTRY} -u ${{ github.actor }} --password-stdin
            
            # 5. Pull новых образов
            echo "⬇️  Pulling images with tag: ${IMAGE_TAG}..."
            if ! GITHUB_REPOSITORY=${GITHUB_REPOSITORY} IMAGE_TAG=${IMAGE_TAG} docker compose -f docker-compose.prod.yml pull; then
              echo '❌ ERROR: Failed to pull Docker images'
              exit 1
            fi
            
            # 6. Запуск новой версии
            echo '🚀 Starting services with docker-compose...'
            if ! GITHUB_REPOSITORY=${GITHUB_REPOSITORY} IMAGE_TAG=${IMAGE_TAG} docker compose -f docker-compose.prod.yml up -d --remove-orphans; then
              echo '❌ ERROR: Failed to start services'
              GITHUB_REPOSITORY=${GITHUB_REPOSITORY} IMAGE_TAG=${IMAGE_TAG} docker compose -f docker-compose.prod.yml logs --tail=100
              exit 1
            fi
            
            # 7. Ожидание готовности сервисов
            echo '⏳ Waiting for services to initialize...'
            sleep 15
            
            # 8. Cleanup старых образов
            echo '🧹 Cleaning up old images...'
            docker image prune -af --filter 'until=24h' || true
            
            # 9. Финальная проверка
            echo '✅ Pre-production deployment initiated successfully!'
            echo 'Services status:'
            GITHUB_REPOSITORY=${GITHUB_REPOSITORY} IMAGE_TAG=${IMAGE_TAG} docker compose -f docker-compose.prod.yml ps
          EOFSH

      - name: Health check
        run: |
          echo '🏥 Running pre-production health checks...'
          
          echo '⏳ Waiting for application initialization...'
          sleep 45
          
          MAX_RETRIES=12
          RETRY_COUNT=0
          RETRY_DELAY=5
          
          echo "Starting health check with $MAX_RETRIES attempts..."
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Health check attempt $RETRY_COUNT/$MAX_RETRIES..."
            
            if curl -f -s http://${{ secrets.PREPROD_SERVER_IP }}:80/api/ > /dev/null 2>&1; then
              echo '✅ Pre-production health check passed!'
              echo '🎉 Pre-production application is healthy!'
              echo "API endpoint: http://${{ secrets.PREPROD_SERVER_IP }}/api/ (via Nginx)"
              exit 0
            fi
            
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Retrying in ${RETRY_DELAY} seconds..."
              sleep $RETRY_DELAY
            fi
          done
          
          echo "❌ Health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: Create Pull Request to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head ${{ github.ref_name }} \
            --title "Release to Production" \
            --body "$(git log -1 --pretty=%B)" \
            --draft || echo "PR already exists or creation failed"

  # ============================================================================
  # Job 5: Deploy to Production Server (main branch)
  # ============================================================================
  deploy-prod:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    env:
      # Используем точный тег образа из build job (latest для main branch)
      IMAGE_TAG: latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Prepare repository name (lowercase)
        run: |
          echo "REPO_LOWERCASE=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Install system dependencies on production VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOFDEPS'
            set -e
            
            echo '🔍 Checking system dependencies...'
            
            # 1. Проверка и установка Docker
            if ! command -v docker &> /dev/null; then
              echo '📦 Docker not found. Installing Docker...'
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              
              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
                $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
                sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              
              # Добавляем текущего пользователя в группу docker
              sudo usermod -aG docker $USER
              echo '✅ Docker installed successfully!'
            else
              echo '✅ Docker is already installed'
              docker --version
            fi
            
            # 2. Проверка Docker Compose v2
            if ! docker compose version &> /dev/null; then
              echo '⚠️ Docker Compose v2 plugin not found. Installing...'
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
              echo '✅ Docker Compose v2 installed successfully!'
            else
              echo '✅ Docker Compose v2 is available'
              docker compose version
            fi
            
            # 3. Создание директории деплоя
            if [ ! -d "${{ secrets.DEPLOY_DIR }}" ]; then
              echo '📁 Creating deployment directory: ${{ secrets.DEPLOY_DIR }}'
              sudo mkdir -p ${{ secrets.DEPLOY_DIR }}
              sudo chown -R $USER:$USER ${{ secrets.DEPLOY_DIR }}
              echo '✅ Deployment directory created!'
            else
              echo '✅ Deployment directory already exists'
              # Убеждаемся что права корректны
              sudo chown -R $USER:$USER ${{ secrets.DEPLOY_DIR }}
            fi
            
            echo '🎉 All system dependencies are ready!'
          EOFDEPS

      - name: Copy docker-compose.prod.yml to server
        run: |
          scp -o StrictHostKeyChecking=no \
            docker-compose.prod.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_DIR }}/

      - name: Copy nginx.conf to server
        run: |
          scp -o StrictHostKeyChecking=no \
            nginx.conf \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_DIR }}/

      - name: Copy generate-production-env.sh script to server
        run: |
          scp -o StrictHostKeyChecking=no \
            scripts/generate-production-env.sh \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_DIR }}/

      - name: Generate production .env file
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          STRIPE_SECRET_KEY: ${{ secrets.PROD_STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.PROD_STRIPE_PUBLISHABLE_KEY }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOFENV'
            set -e
            cd ${{ secrets.DEPLOY_DIR }}
            
            echo '🔐 Generating production .env file...'
            
            # Make script executable
            chmod +x generate-production-env.sh
            
            # Run script with required environment variables
            SERVER_IP="${{ secrets.SERVER_IP }}" \
            STRIPE_SECRET_KEY="${{ secrets.PROD_STRIPE_SECRET_KEY }}" \
            STRIPE_PUBLISHABLE_KEY="${{ secrets.PROD_STRIPE_PUBLISHABLE_KEY }}" \
            ./generate-production-env.sh
            
            echo '✅ Production .env ready!'
          EOFENV

      - name: Deploy to production server
        env:
          GITHUB_REPOSITORY: ${{ env.REPO_LOWERCASE }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOFSH'
            set -e
            
            export DEPLOY_DIR="${{ secrets.DEPLOY_DIR }}"
            export GITHUB_REPOSITORY="${{ env.REPO_LOWERCASE }}"
            export REGISTRY="${{ env.REGISTRY }}"
            export IMAGE_TAG="${{ env.IMAGE_TAG }}"
            
            cd ${DEPLOY_DIR}
            
            echo '🚀 Starting deployment...'
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Deploy directory: ${DEPLOY_DIR}"
            echo "Image tag: ${IMAGE_TAG}"
            
            # 1. Проверка и создание host directories
            echo '🔍 Validating host directories...'
            for dir in media staticfiles logs postgres-data; do
              if [ ! -d "${DEPLOY_DIR}/${dir}" ]; then
                echo "Creating directory: ${DEPLOY_DIR}/${dir}"
                mkdir -p "${DEPLOY_DIR}/${dir}"
              fi
            done
            
            # 2. Проверка .env файла (должен быть создан предыдущим шагом)
            echo '🔍 Validating .env file...'
            if [ ! -f "${DEPLOY_DIR}/.env" ]; then
              echo '❌ ERROR: .env file not found at ${DEPLOY_DIR}/.env'
              echo 'This should have been auto-generated by generate-production-env.sh'
              exit 1
            fi
            echo '✅ .env file exists'
            
            # 3. Проверка docker-compose.prod.yml
            if [ ! -f "${DEPLOY_DIR}/docker-compose.prod.yml" ]; then
              echo '❌ ERROR: docker-compose.prod.yml not found'
              exit 1
            fi
            
            # 4. Логин в GHCR
            echo '🔐 Login to GitHub Container Registry...'
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${REGISTRY} -u ${{ github.actor }} --password-stdin
            
            # 5. Pull новых образов с точным тегом
            echo "⬇️  Pulling images with tag: ${IMAGE_TAG}..."
            if ! GITHUB_REPOSITORY=${GITHUB_REPOSITORY} IMAGE_TAG=${IMAGE_TAG} docker compose -f docker-compose.prod.yml pull; then
              echo '❌ ERROR: Failed to pull Docker images'
              echo 'Possible reasons:'
              echo '  - GHCR authentication failed'
              echo '  - Image does not exist in registry'
              echo '  - Network connectivity issues'
              exit 1
            fi
            
            # 6. Сохранение текущего image tag для rollback
            echo '💾 Saving current image tag for potential rollback...'
            OLD_IMAGE_TAG=$(docker inspect lms_web 2>/dev/null | jq -r '.[0].Config.Image' | cut -d':' -f2 || echo "")
            if [ -n "$OLD_IMAGE_TAG" ]; then
              echo "Previous image tag: $OLD_IMAGE_TAG"
            fi
            
            # 7. Запуск новой версии
            echo '🚀 Starting services with docker-compose...'
            if ! GITHUB_REPOSITORY=${GITHUB_REPOSITORY} IMAGE_TAG=${IMAGE_TAG} docker compose -f docker-compose.prod.yml up -d --remove-orphans; then
              echo '❌ ERROR: Failed to start services'
              echo '📋 Container logs:'
              GITHUB_REPOSITORY=${GITHUB_REPOSITORY} IMAGE_TAG=${IMAGE_TAG} docker compose -f docker-compose.prod.yml logs --tail=100
              
              # Rollback: восстановление предыдущей версии если была
              if [ -n "$OLD_IMAGE_TAG" ] && [ "$OLD_IMAGE_TAG" != "null" ]; then
                echo "⏮️  Attempting rollback to previous version: $OLD_IMAGE_TAG"
                GITHUB_REPOSITORY=${GITHUB_REPOSITORY} IMAGE_TAG=${OLD_IMAGE_TAG} docker compose -f docker-compose.prod.yml up -d --remove-orphans || echo "Rollback failed - manual intervention required"
              else
                echo "No previous version to rollback to - this was likely the first deployment"
              fi
              exit 1
            fi
            
            # 8. Ожидание готовности сервисов
            echo '⏳ Waiting for services to initialize...'
            sleep 15
            
            # 9. Проверка статуса всех сервисов
            echo '🔍 Checking services health...'
            UNHEALTHY_SERVICES=$(GITHUB_REPOSITORY=${GITHUB_REPOSITORY} IMAGE_TAG=${IMAGE_TAG} docker compose -f docker-compose.prod.yml ps --format json | jq -r 'select(.Health != "healthy" and .State == "running") | .Service' 2>/dev/null || echo "")
            
            if [ -n "$UNHEALTHY_SERVICES" ]; then
              echo "⚠️  Warning: Some services are not healthy yet: $UNHEALTHY_SERVICES"
              echo "Services will continue starting in background"
            fi
            
            # 10. Cleanup старых образов
            echo '🧹 Cleaning up old images...'
            docker image prune -af --filter 'until=24h' || true
            
            # 11. Финальная проверка
            echo '✅ Deployment initiated successfully!'
            echo 'Services status:'
            GITHUB_REPOSITORY=${GITHUB_REPOSITORY} IMAGE_TAG=${IMAGE_TAG} docker compose -f docker-compose.prod.yml ps
          EOFSH

      - name: Health check
        env:
          GITHUB_REPOSITORY: ${{ env.REPO_LOWERCASE }}
        run: |
          echo '🏥 Running application health checks...'
          
          # Ждем полной инициализации (collectstatic, миграции)
          echo '⏳ Waiting for application initialization...'
          sleep 45
          
          # Проверяем доступность API с retry loop
          MAX_RETRIES=12
          RETRY_COUNT=0
          RETRY_DELAY=5
          
          echo "Starting health check with $MAX_RETRIES attempts..."
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Health check attempt $RETRY_COUNT/$MAX_RETRIES..."
            
            if curl -f -s http://${{ secrets.SERVER_IP }}:80/api/ > /dev/null 2>&1; then
              echo '✅ Health check passed!'
              echo '🎉 Application is healthy and running!'
              echo "API endpoint: http://${{ secrets.SERVER_IP }}/api/ (via Nginx)"
              exit 0
            fi
            
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Retrying in ${RETRY_DELAY} seconds..."
              sleep $RETRY_DELAY
            fi
          done
          
          # Health check failed после всех попыток
          echo "❌ Health check failed after $MAX_RETRIES attempts"
          echo '📋 Fetching container logs for diagnostics...'
          
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << EOFDIAG
            cd ${{ secrets.DEPLOY_DIR }}
            echo "=== Services Status ==="
            GITHUB_REPOSITORY=${{ env.REPO_LOWERCASE }} docker compose -f docker-compose.prod.yml ps
            echo ""
            echo "=== Web Container Logs (last 50 lines) ==="
            GITHUB_REPOSITORY=${{ env.REPO_LOWERCASE }} docker compose -f docker-compose.prod.yml logs --tail=50 web
            echo ""
            echo "=== Database Container Logs (last 30 lines) ==="
            GITHUB_REPOSITORY=${{ env.REPO_LOWERCASE }} docker compose -f docker-compose.prod.yml logs --tail=30 db
          EOFDIAG
          
          exit 1
