name: Django CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ✅ Ваши существующие jobs (оставляем как есть)
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings_test
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'dummy-for-tests' }}

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python 3.13.5
      uses: actions/setup-python@v4
      with:
        python-version: '3.13.5'

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Configure Poetry
      run: |
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project true

    - name: Cache Poetry virtualenv
      uses: actions/cache@v3
      with:
        path: .venv
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Cache Poetry packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pypoetry
        key: ${{ runner.os }}-poetry-packages-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-packages-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev postgresql-client redis-tools

    - name: Install Python dependencies
      run: poetry install --no-root --with tests

    - name: Wait for databases
      run: |
        until pg_isready -h localhost -p 5432; do sleep 2; done
        until redis-cli -h localhost ping | grep -q PONG; do sleep 2; done

    - name: Run migrations
      run: poetry run python manage.py migrate

    - name: Run tests with pytest and coverage
      run: |
        poetry run pytest \
          --cov=./ \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-fail-under=80 \
          -v

    - name: Run security lint with bandit
      run: poetry run bandit -r . -f html -o security_report.html || true

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 30

    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: security_report.html
        retention-days: 30

  lint:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python 3.13.5
      uses: actions/setup-python@v4
      with:
        python-version: '3.13.5'

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: poetry install --no-root --with lint

    - name: Run comprehensive linting
      run: |
        echo "=== Black Check ==="
        poetry run black --check .

        echo "=== Isort Check ==="
        poetry run isort --check-only .

        echo "=== Ruff Check ==="
        poetry run ruff check .

        echo "=== Flake8 Check ==="
        poetry run flake8 .

  # 🆕 НОВЫЙ CD КОМПОНЕНТ - Сборка и публикация Docker образа
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha
          type=ref,event=branch
          latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Print image info
      run: |
        echo "✅ Image built and pushed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
        echo "📦 Tags: ${{ steps.meta.outputs.tags }}"

  # 🆕 НОВЫЙ CD КОМПОНЕНТ - Деплой на сервер
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.8.1
      with:
        ssh-private-key: ${{ secrets.SSH_KEY }}

    - name: Deploy to production server
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
          set -e
          echo '🚀 Starting deployment...'

          # Логин в GHCR (если нужно)
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

          # Скачиваем новый образ
          echo '📥 Pulling new image...'
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          # Останавливаем старый контейнер
          echo '🛑 Stopping old container...'
          docker stop drf-app || true
          docker rm drf-app || true

          # Запускаем новый контейнер
          echo '🎯 Starting new container...'
          docker run -d \
            --name drf-app \
            --env-file /opt/docker-projects/drf/shared/.env \
            -p 8000:8000 \
            -v /opt/docker-projects/drf/shared/media:/app/media \
            -v /opt/docker-projects/drf/shared/logs:/app/logs \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          # Чистим старые образы
          echo '🧹 Cleaning up...'
          docker image prune -f

          # Проверяем что контейнер запустился
          echo '✅ Checking container status...'
          docker ps | grep drf-app

          echo '🎉 Deployment completed successfully!'
        "

    - name: Health check
      run: |
        # Ждем и проверяем что приложение запустилось
        sleep 15
        curl -f http://${{ secrets.SERVER_IP }}:8000/api/health/ || \
        curl -f http://${{ secrets.SERVER_IP }}:8000/ || \
        echo '⚠️  Health check failed, but deployment completed'
