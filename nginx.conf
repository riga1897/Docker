# Nginx конфигурация для Django LMS Production
# Архитектура: Nginx (80/443) → Reverse Proxy → Gunicorn (8000)

upstream django_backend {
    # Gunicorn запущен в Docker контейнере 'web' на порту 8000
    server web:8000;
}

server {
    listen 80;
    server_name _;
    
    # Максимальный размер загружаемых файлов
    client_max_body_size 100M;
    
    # Таймауты
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    
    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Отдача статических файлов напрямую (без обращения к Django)
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Отдача медиа файлов напрямую
    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # Healthcheck эндпоинт для мониторинга
    location /health/ {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Все остальные запросы проксируются на Django (Gunicorn)
    location / {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (если понадобится)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Отключаем буферизацию для streaming responses
        proxy_buffering off;
    }
    
    # Запрет доступа к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
